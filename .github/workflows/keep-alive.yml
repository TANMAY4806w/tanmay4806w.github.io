name: Keep Supabase Awake

on:
  schedule:
    # Runs at 00:00 UTC every 4 days
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase URL
        run: |
          echo "Pinging Supabase to prevent free tier inactivity pause..."
          curl -s -f -m 15 "https://hnpkbctycneamicrspfw.supabase.co/functions/v1/portfolio-chat" || echo "Ping dispatched successfully."
